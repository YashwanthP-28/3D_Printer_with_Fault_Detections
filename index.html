<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Print Failure Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;700&display=swap" rel="stylesheet" />

<style>
/* ── Reset & Base ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #090c10;
  --panel:     #0d1117;
  --border:    #1e2d40;
  --accent:    #00e5ff;
  --warn:      #ff4d4d;
  --ok:        #00ff88;
  --dim:       #3a4a5c;
  --text:      #c9d8e8;
  --text-dim:  #5a7080;
  --mono:      'Share Tech Mono', monospace;
  --sans:      'Rajdhani', sans-serif;
  --display:   'Exo 2', sans-serif;
  --glow-a:    0 0 12px rgba(0,229,255,.45);
  --glow-w:    0 0 12px rgba(255,77,77,.55);
  --glow-ok:   0 0 12px rgba(0,255,136,.4);
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  overflow-x: hidden;
}

/* scanline overlay */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,.18) 2px,
    rgba(0,0,0,.18) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ── Layout ───────────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-rows: 56px 1fr;
  grid-template-columns: 1fr 340px;
  grid-template-areas:
    "header header"
    "main   sidebar";
  height: 100vh;
  gap: 0;
}

/* ── Header ───────────────────────────────────────────────────────────── */
header {
  grid-area: header;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 34px; height: 34px;
  position: relative;
}

.logo-icon svg { width: 100%; height: 100%; }

.logo-text {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #fff;
}

.logo-text span { color: var(--accent); }

.header-status {
  display: flex;
  align-items: center;
  gap: 20px;
  font-family: var(--mono);
  font-size: .75rem;
  color: var(--text-dim);
}

.status-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px;
  border-radius: 2px;
  border: 1px solid var(--border);
  font-size: .7rem;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.status-pill.connecting { border-color: var(--dim); color: var(--dim); }
.status-pill.online     { border-color: var(--ok); color: var(--ok); box-shadow: var(--glow-ok); }
.status-pill.error      { border-color: var(--warn); color: var(--warn); box-shadow: var(--glow-w); }

.pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: currentColor;
  animation: pulse 1.4s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: .25; }
}

#clock {
  font-family: var(--mono);
  font-size: .8rem;
  color: var(--accent);
  letter-spacing: .1em;
}

/* ── Main ─────────────────────────────────────────────────────────────── */
main {
  grid-area: main;
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow: hidden;
  position: relative;
  background: #06090d;
}

/* camera container */
.camera-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #000;
}

/* corner brackets */
.camera-wrap::before,
.camera-wrap::after,
.camera-wrap .corner-bl,
.camera-wrap .corner-br {
  content: '';
  position: absolute;
  width: 28px; height: 28px;
  border-color: var(--accent);
  border-style: solid;
  z-index: 5;
  opacity: .7;
}
.camera-wrap::before  { top:8px; left:8px;  border-width:2px 0 0 2px; }
.camera-wrap::after   { top:8px; right:8px; border-width:2px 2px 0 0; }
.camera-wrap .corner-bl { bottom:8px; left:8px;  border-width:0 0 2px 2px; }
.camera-wrap .corner-br { bottom:8px; right:8px; border-width:0 2px 2px 0; }

#video {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  transform: scaleX(-1); /* mirror */
}

#canvas {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* overlay label top-left */
.cam-label {
  position: absolute;
  top: 16px; left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: .65rem;
  letter-spacing: .2em;
  color: var(--accent);
  opacity: .6;
  z-index: 6;
  text-transform: uppercase;
}

/* fps / detection counter bar */
.stats-bar {
  display: flex;
  gap: 24px;
  padding: 6px 16px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  font-family: var(--mono);
  font-size: .7rem;
  color: var(--text-dim);
}

.stat { display: flex; gap: 6px; align-items: center; }
.stat-val { color: var(--accent); }
.stat-warn { color: var(--warn); }

/* ── Sidebar ──────────────────────────────────────────────────────────── */
aside {
  grid-area: sidebar;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-left: 1px solid var(--border);
  overflow: hidden;
}

.panel-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}

.panel-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: .8rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.badge {
  font-family: var(--mono);
  font-size: .65rem;
  padding: 2px 7px;
  border-radius: 2px;
  background: rgba(0,229,255,.08);
  border: 1px solid rgba(0,229,255,.2);
  color: var(--accent);
}

/* Detection log */
#log {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#log::-webkit-scrollbar { width: 4px; }
#log::-webkit-scrollbar-track { background: transparent; }
#log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.log-empty {
  margin: auto;
  text-align: center;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: .72rem;
  line-height: 2;
  opacity: .5;
}

.log-card {
  background: rgba(255,77,77,.06);
  border: 1px solid rgba(255,77,77,.2);
  border-left: 3px solid var(--warn);
  border-radius: 3px;
  padding: 9px 10px;
  animation: slideIn .25s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(12px); }
  to   { opacity: 1; transform: translateX(0); }
}

.log-card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 6px;
}

.log-label {
  font-family: var(--display);
  font-weight: 700;
  font-size: .85rem;
  color: #fff;
  letter-spacing: .03em;
}

.log-time {
  font-family: var(--mono);
  font-size: .65rem;
  color: var(--text-dim);
}

.conf-bar-wrap {
  display: flex; align-items: center; gap: 8px;
}

.conf-bar-bg {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,.07);
  border-radius: 2px;
  overflow: hidden;
}

.conf-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #ff4d4d, #ff8800);
  transition: width .4s ease;
}

.conf-val {
  font-family: var(--mono);
  font-size: .65rem;
  color: var(--warn);
  min-width: 36px;
  text-align: right;
}

/* Summary row */
.summary {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.sum-box {
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px 10px;
}

.sum-label {
  font-family: var(--mono);
  font-size: .6rem;
  color: var(--text-dim);
  letter-spacing: .12em;
  text-transform: uppercase;
}

.sum-val {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--accent);
  margin-top: 2px;
}

.sum-val.warn { color: var(--warn); }

/* Controls */
.controls {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}

.btn {
  flex: 1;
  padding: 9px 0;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: var(--sans);
  font-weight: 600;
  font-size: .78rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 2px;
  transition: all .2s;
}

.btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow-a); }
.btn.primary {
  background: rgba(0,229,255,.1);
  border-color: var(--accent);
  color: var(--accent);
}
.btn.primary:hover { background: rgba(0,229,255,.2); }
.btn.danger  { border-color: rgba(255,77,77,.4); color: var(--warn); }
.btn.danger:hover { background: rgba(255,77,77,.1); box-shadow: var(--glow-w); }

/* ── Toast Container ──────────────────────────────────────────────────── */
#toasts {
  position: fixed;
  bottom: 24px; right: 24px;
  display: flex; flex-direction: column-reverse;
  gap: 10px;
  z-index: 1000;
  max-width: 340px;
}

.toast {
  background: #0d1117;
  border: 1px solid rgba(255,77,77,.5);
  border-left: 4px solid var(--warn);
  border-radius: 3px;
  padding: 12px 14px;
  box-shadow: 0 4px 30px rgba(0,0,0,.7), var(--glow-w);
  animation: toastIn .3s cubic-bezier(.16,1,.3,1) forwards;
  position: relative;
  overflow: hidden;
}

.toast::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--warn);
  animation: toastTimer linear forwards;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(60px) scale(.95); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}

@keyframes toastTimer {
  from { width: 100%; }
  to   { width: 0; }
}

@keyframes toastOut {
  to { opacity: 0; transform: translateX(60px) scale(.95); max-height: 0; padding: 0; margin: 0; }
}

.toast-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}

.toast-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: .82rem;
  letter-spacing: .05em;
  color: #fff;
}

.toast-badge {
  font-family: var(--mono);
  font-size: .6rem;
  color: var(--warn);
  letter-spacing: .1em;
  text-transform: uppercase;
}

.toast-body {
  font-family: var(--mono);
  font-size: .68rem;
  color: var(--text-dim);
  line-height: 1.7;
}

.toast-body strong { color: var(--text); }

/* ── Threshold slider ─────────────────────────────────────────────────── */
.slider-row {
  padding: 10px 14px 0;
  border-top: 1px solid var(--border);
}

.slider-label {
  display: flex; justify-content: space-between;
  font-family: var(--mono);
  font-size: .65rem;
  color: var(--text-dim);
  margin-bottom: 5px;
}

.slider-label span { color: var(--accent); }

input[type=range] {
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
}
</style>
</head>

<body>
<div class="app">

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="17,2 32,11 32,23 17,32 2,23 2,11" stroke="#00e5ff" stroke-width="1.5" fill="rgba(0,229,255,.07)"/>
          <polyline points="17,2 17,17 32,11" stroke="#00e5ff" stroke-width="1" opacity=".5"/>
          <circle cx="17" cy="17" r="3.5" fill="#00e5ff" opacity=".9"/>
          <line x1="17" y1="17" x2="2" y2="23" stroke="#00e5ff" stroke-width="1" opacity=".3"/>
          <line x1="17" y1="17" x2="32" y2="23" stroke="#00e5ff" stroke-width="1" opacity=".3"/>
          <line x1="17" y1="17" x2="17" y2="32" stroke="#00e5ff" stroke-width="1" opacity=".3"/>
        </svg>
      </div>
      <div class="logo-text">Print<span>Guard</span></div>
    </div>

    <div class="header-status">
      <div id="model-status" class="status-pill connecting">
        <span class="pulse"></span>
        <span id="model-status-text">Connecting…</span>
      </div>
      <div id="clock">--:--:--</div>
    </div>
  </header>

  <!-- ── Camera / Main ────────────────────────────────────────────────── -->
  <main>
    <div class="camera-wrap">
      <span class="cam-label">Live Feed · Webcam</span>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="stats-bar">
      <div class="stat">INFERENCE <span id="fps-val" class="stat-val">-- fps</span></div>
      <div class="stat">LATENCY <span id="lat-val" class="stat-val">-- ms</span></div>
      <div class="stat">OBJECTS <span id="obj-val" class="stat-val">0</span></div>
      <div class="stat">SESSION FAILS <span id="sess-val" class="stat-val stat-warn">0</span></div>
    </div>
  </main>

  <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
  <aside>
    <div class="panel-header">
      <span class="panel-title">Failure Log</span>
      <span class="badge" id="log-count">0</span>
    </div>

    <div id="log">
      <div class="log-empty" id="log-empty">
        ▣ NO FAILURES DETECTED<br>
        System monitoring…
      </div>
    </div>

    <div class="summary">
      <div class="sum-box">
        <div class="sum-label">Total Fails</div>
        <div class="sum-val warn" id="total-fails">0</div>
      </div>
      <div class="sum-box">
        <div class="sum-label">Top Failure</div>
        <div class="sum-val" id="top-fail" style="font-size:.85rem; margin-top:5px; color:var(--text-dim)">—</div>
      </div>
    </div>

    <div class="slider-row">
      <div class="slider-label">
        Confidence Threshold
        <span id="thresh-val">50%</span>
      </div>
      <input type="range" id="threshold" min="10" max="95" value="50" />
    </div>

    <div class="controls">
      <button class="btn primary" id="btn-start">Start</button>
      <button class="btn" id="btn-stop" disabled>Stop</button>
      <button class="btn danger" id="btn-clear">Clear</button>
    </div>
  </aside>

</div>

<!-- ── Toast zone ────────────────────────────────────────────────────── -->
<div id="toasts"></div>

<script>
// ── Config ─────────────────────────────────────────────────────────────────
const SERVER = 'http://localhost:5050';
const INFER_INTERVAL_MS = 200;   // send frame every Nms
const TOAST_DURATION_MS = 4500;
const BOX_COLORS = [
  '#ff4d4d', '#ff8800', '#ff006e', '#ff3cac', '#c200fb'
];

// ── State ───────────────────────────────────────────────────────────────────
let running = false;
let inferTimer = null;
let totalFails = 0;
let labelCounts = {};
let lastFps = Date.now();
let frameCount = 0;

// ── DOM refs ────────────────────────────────────────────────────────────────
const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const log      = document.getElementById('log');
const logEmpty = document.getElementById('log-empty');
const toasts   = document.getElementById('toasts');

// ── Clock ───────────────────────────────────────────────────────────────────
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-GB', { hour12: false });
}
tick();
setInterval(tick, 1000);

// ── Server health ───────────────────────────────────────────────────────────
async function checkServer() {
  const el = document.getElementById('model-status');
  const tx = document.getElementById('model-status-text');
  try {
    const r = await fetch(`${SERVER}/health`, { signal: AbortSignal.timeout(3000) });
    const d = await r.json();
    if (d.model_loaded) {
      el.className = 'status-pill online';
      tx.textContent = 'Model Ready';
    } else {
      el.className = 'status-pill error';
      tx.textContent = 'Model Missing';
    }
  } catch {
    el.className = 'status-pill error';
    tx.textContent = 'Server Offline';
  }
}
checkServer();
setInterval(checkServer, 8000);

// ── Webcam ──────────────────────────────────────────────────────────────────
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 1280 }, height: { ideal: 720 } }
  });
  video.srcObject = stream;
  await new Promise(res => video.addEventListener('loadedmetadata', res, { once: true }));
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
}

// ── Frame capture ────────────────────────────────────────────────────────────
function captureFrame() {
  const tmp = document.createElement('canvas');
  tmp.width  = video.videoWidth;
  tmp.height = video.videoHeight;
  const tc = tmp.getContext('2d');
  tc.drawImage(video, 0, 0);
  return tmp.toDataURL('image/jpeg', 0.75);
}

// ── Inference loop ───────────────────────────────────────────────────────────
async function runInference() {
  if (!running) return;

  const threshold = +document.getElementById('threshold').value / 100;
  const t0 = performance.now();
  const imageData = captureFrame();

  try {
    const resp = await fetch(`${SERVER}/detect`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: imageData }),
      signal: AbortSignal.timeout(5000)
    });
    const data = await resp.json();
    const lat = Math.round(performance.now() - t0);
    document.getElementById('lat-val').textContent = `${lat} ms`;

    const dets = (data.detections || []).filter(d => d.confidence >= threshold);
    drawBoxes(dets);

    document.getElementById('obj-val').textContent = dets.length;

    if (dets.length) onDetections(dets);

    // FPS
    frameCount++;
    const now = Date.now();
    if (now - lastFps >= 1000) {
      document.getElementById('fps-val').textContent = `${frameCount} fps`;
      frameCount = 0;
      lastFps = now;
    }

  } catch (e) {
    console.warn('Inference error:', e);
  }

  if (running) inferTimer = setTimeout(runInference, INFER_INTERVAL_MS);
}

// ── Draw bounding boxes ──────────────────────────────────────────────────────
function drawBoxes(dets) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // mirror to match video
  ctx.save();
  ctx.scale(-1, 1);
  ctx.translate(-canvas.width, 0);

  dets.forEach((d, i) => {
    const color = BOX_COLORS[i % BOX_COLORS.length];
    const [x1, y1, x2, y2] = d.bbox;
    const w = x2 - x1, h = y2 - y1;

    // glow box
    ctx.shadowColor = color;
    ctx.shadowBlur  = 14;
    ctx.strokeStyle = color;
    ctx.lineWidth   = 2;
    ctx.strokeRect(x1, y1, w, h);
    ctx.shadowBlur = 0;

    // corner marks
    const cs = 14;
    ctx.lineWidth = 3;
    [[x1,y1],[x2,y1],[x1,y2],[x2,y2]].forEach(([cx,cy], qi) => {
      const sx = qi%2===0?1:-1, sy = qi<2?1:-1;
      ctx.beginPath();
      ctx.moveTo(cx+sx*cs, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy+sy*cs);
      ctx.stroke();
    });

    // label bg
    const label = `${d.label}  ${(d.confidence*100).toFixed(1)}%`;
    ctx.font = 'bold 12px "Share Tech Mono"';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = color;
    ctx.globalAlpha = .85;
    ctx.fillRect(x1, y1 - 20, tw + 12, 20);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillText(label, x1 + 6, y1 - 5);
  });

  ctx.restore();
}

// ── Handle new detections ────────────────────────────────────────────────────
let lastToastTime = {};

function onDetections(dets) {
  dets.forEach(d => {
    totalFails++;
    labelCounts[d.label] = (labelCounts[d.label] || 0) + 1;

    addLogCard(d);

    // debounce toasts per label (1 per 3 sec)
    const now = Date.now();
    if (!lastToastTime[d.label] || now - lastToastTime[d.label] > 3000) {
      lastToastTime[d.label] = now;
      showToast(d);
    }
  });

  // update stats
  document.getElementById('total-fails').textContent = totalFails;
  document.getElementById('sess-val').textContent = totalFails;

  const top = Object.entries(labelCounts).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('top-fail').textContent = top ? top[0] : '—';
  document.getElementById('log-count').textContent = log.querySelectorAll('.log-card').length;
  logEmpty.style.display = 'none';
}

// ── Log card ─────────────────────────────────────────────────────────────────
function addLogCard(d) {
  const card = document.createElement('div');
  card.className = 'log-card';
  card.innerHTML = `
    <div class="log-card-head">
      <span class="log-label">${escHtml(d.label)}</span>
      <span class="log-time">${d.timestamp}</span>
    </div>
    <div class="conf-bar-wrap">
      <div class="conf-bar-bg">
        <div class="conf-bar-fill" style="width:${(d.confidence*100).toFixed(1)}%"></div>
      </div>
      <span class="conf-val">${(d.confidence*100).toFixed(1)}%</span>
    </div>`;
  log.prepend(card);

  // keep log at max 80 entries
  const cards = log.querySelectorAll('.log-card');
  if (cards.length > 80) cards[cards.length-1].remove();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(d) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.setProperty('--dur', `${TOAST_DURATION_MS}ms`);
  t.style.cssText += `--dur:${TOAST_DURATION_MS}ms`;
  t.innerHTML = `
    <div class="toast-header">
      <span class="toast-title">⚠ Failure Detected</span>
      <span class="toast-badge">ALERT</span>
    </div>
    <div class="toast-body">
      <strong>Type:</strong> ${escHtml(d.label)}<br>
      <strong>Confidence:</strong> ${(d.confidence*100).toFixed(1)}%<br>
      <strong>Time:</strong> ${d.timestamp}
    </div>`;
  t.querySelector('::after'); // trigger reflow
  t.style.getPropertyValue('animation'); // force paint
  // apply duration to ::after via CSS var
  t.style.setProperty('--toast-dur', `${TOAST_DURATION_MS}ms`);
  t.querySelector('.toast').style;

  // patch timer animation
  const style = document.createElement('style');
  const uid = 'toast_' + Date.now();
  t.id = uid;
  style.textContent = `#${uid}::after { animation-duration: ${TOAST_DURATION_MS}ms; }`;
  document.head.appendChild(style);

  toasts.prepend(t);

  setTimeout(() => {
    t.style.animation = 'toastOut .35s ease forwards';
    setTimeout(() => { t.remove(); style.remove(); }, 360);
  }, TOAST_DURATION_MS);
}

// ── Controls ─────────────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', async () => {
  if (running) return;
  try {
    await startCamera();
    running = true;
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled = false;
    runInference();
  } catch (e) {
    alert('Camera access denied or unavailable:\n' + e.message);
  }
});

document.getElementById('btn-stop').addEventListener('click', () => {
  running = false;
  clearTimeout(inferTimer);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('fps-val').textContent = '-- fps';
  document.getElementById('lat-val').textContent = '-- ms';
  document.getElementById('obj-val').textContent = '0';
});

document.getElementById('btn-clear').addEventListener('click', () => {
  log.querySelectorAll('.log-card').forEach(c => c.remove());
  logEmpty.style.display = '';
  document.getElementById('log-count').textContent = '0';
  totalFails = 0;
  labelCounts = {};
  document.getElementById('total-fails').textContent = '0';
  document.getElementById('sess-val').textContent = '0';
  document.getElementById('top-fail').textContent = '—';
});

document.getElementById('threshold').addEventListener('input', e => {
  document.getElementById('thresh-val').textContent = e.target.value + '%';
});

// ── Util ─────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
